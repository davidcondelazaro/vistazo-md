# Al subir una etiqueta vX.Y (git tag v1.0 && git push --tags) compila la app
# y publica el .zip en GitHub Releases. Recuerda subir MARKETING_VERSION en project.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Compilar y empaquetar
        run: ./scripts/release.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        # Si la release ya existe (creada a mano), solo reemplaza el zip.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Vistazo MD $GITHUB_REF_NAME" --generate-notes
          fi
