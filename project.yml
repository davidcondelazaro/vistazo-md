name: VistazoMD
options:
  bundleIdPrefix: com.dconde
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Firma ad-hoc ("Sign to Run Locally"): suficiente para usarla en este Mac.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  VistazoMD:
    type: application
    platform: macOS
    sources:
      - VistazoMD
      - Shared
    info:
      path: VistazoMD/Info.plist
      properties:
        CFBundleDisplayName: Vistazo MD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 David Conde"
        NSPrincipalClass: NSApplication
        # La app se ofrece como visor (no editor) de Markdown en "Abrir con".
        CFBundleDocumentTypes:
          - CFBundleTypeName: Documento Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.markdown
              - io.typora.markdown
              - net.ia.markdown
              - com.rstudio.rmarkdown
              - org.quarto.qmarkdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Documento Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn, mdtxt, mdtext]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dconde.VistazoMD
        PRODUCT_NAME: Vistazo MD
        CODE_SIGN_ENTITLEMENTS: VistazoMD/VistazoMD.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MarkdownPreview
        embed: true
        codeSign: true
  MarkdownPreview:
    type: app-extension
    platform: macOS
    sources:
      - QuickLookExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dconde.VistazoMD.MarkdownPreview
        CODE_SIGN_ENTITLEMENTS: QuickLookExtension/MarkdownPreview.entitlements
        INFOPLIST_FILE: QuickLookExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
